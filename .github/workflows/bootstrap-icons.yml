name: Bootstrap Static App Icons

on:
  push:
    paths:
      - .github/workflows/bootstrap-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow
      - name: Download and normalize official icons
        shell: bash
        run: |
          python - <<'PY'
          import io
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from PIL import Image

          images = {
              "feather": ("claration/feather", "31ab6de455f2a6108f6830e343dee826310c03be", "Feather/Resources/Assets.xcassets/AppIcon.appiconset/feather.png"),
              "piliplus": ("bggRGjQaUbCoE/PiliPlus", "d9e9626f1a3f89cd9ca85e18f61aaba02634e12a", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "c001apk": ("TG-Twilight/c001apk", "8373ffe50a2bbf32420f0bffd45ded16bda75b65", "apps/flutter/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "kazumi": ("Predidit/Kazumi", "69ba855ef4554b79a18d8becc83165c0fd000443", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "animeko": ("open-ani/animeko", "bd7a42f3507606eb7ecadf8b1e71a3d8e18fda66", "app/ios/Animeko/Assets.xcassets/AppIcon.appiconset/1024.png"),
              "fluxdown": ("zerx-lab/FluxDown", "dab3400f92301119a55742bdcaf9dbd5dc23ccce", "assets/logo/macos/app_icon_1024.png"),
              "serverbox": ("lollipopkit/flutter_server_box", "0f7c9a2e717ae2788c6247ce7e215f6490bc462e", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-1024.png"),
              "kelivo": ("Chevey339/kelivo", "84b2d835bd870702efd0a7639e535430fd47bb3a", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "spotube": ("team-spotube/spotube", "08f8f65a2a7fcfb94c69882333fe0a9f7e56d0ec", "iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png"),
              "purelive": ("liuchuancong/pure_live", "36cf04da2e7678e8155a67dc21ed4ba11e804367", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "anich": ("Sle2p/AniCh", "c5729a28af239aec78c7059ad122ff00f3f7c47a", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "itorrent": ("XITRIX/iTorrent", "6229dfaed9527d6502466df98cee07723c0f75e8", "iTorrent/Core/Assets/Assets.xcassets/AppIcons/AppIcon.appiconset/Frame 18.png"),
              "skystream": ("akashdh11/skystream", "f5523ae07d729b579be30976df8783a0b98c4559", "ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon~ios-marketing.png"),
              "melox": ("youshen2/MeloX", "09713edb847a0f0a3515a34f779cc630d4fe5985", "MeloX/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"),
              "beansmusic": ("XIaodou0416/Beans-Music", "f9881318caf774129205c3160510ef0dfa318adc", "Beans/Assets.xcassets/AppIcon.appiconset/AppIcon.png"),
              "aidoku": ("Aidoku/Aidoku", "41ae2a604213d4eeb5bf19287eec675ea90e15aa", "Aidoku/App/Resources/Assets.xcassets/AppIcon.appiconset/Icon.png"),
              "simplelive": ("June6699/dart_simple_live", "33b3f1ecbe2a3af7c79918b74b428d16d47884b3", "simple_live_app/ios/Runner/Assets.xcassets/AppIcon.appiconset/icon-1024.png"),
              "breeze": ("deretame/Breeze", "0587d6982106059f4f69d4a64a75566501a633f8", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
              "animeflow": ("openAnimeFlow/AnimeFlow", "40eb5f3b3e692888f7e78bdb4431572c2b2d1961", "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"),
          }
          output = Path("icons")
          output.mkdir(exist_ok=True)
          for name, (repo, revision, path) in images.items():
              url = f"https://raw.githubusercontent.com/{repo}/{revision}/{quote(path, safe='/')}"
              for attempt in range(3):
                  try:
                      request = Request(url, headers={"User-Agent": "xndeye-ipa-icons"})
                      with urlopen(request, timeout=30) as response:
                          data = response.read(5_000_001)
                      if len(data) > 5_000_000:
                          raise ValueError("Icon too large")
                      with Image.open(io.BytesIO(data)) as original:
                          original.load()
                          if original.width != original.height or original.width < 120:
                              raise ValueError(f"Invalid icon size: {original.size}")
                          icon = original.convert("RGBA").resize((512, 512), Image.Resampling.LANCZOS)
                          icon.save(output / f"{name}.png", format="PNG", optimize=True)
                      print(f"{name}: original {original.size}, PNG 512x512")
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 ** (attempt + 1))
          assert len(list(output.glob("*.png"))) == len(images)
          PY
      - name: Commit static icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor 19 verified upstream application icons"
            git push origin HEAD:main
          fi
