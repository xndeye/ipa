# 应用分类规范：category 直接使用 AltStore 官方标准值（区分大小写）。
#   developer     开发：编程、调试、服务器与开发运维
#   entertainment 影音：音乐、影视、直播、动漫及媒体播放
#   games         游戏：游戏及相关辅助
#   lifestyle     生活：购物、出行、健康与日常服务
#   other         其他：阅读、漫画等其他分类未覆盖的应用
#   photo-video   摄影与视频：拍摄、修图、剪辑及影像创作
#   social        社交：社区、论坛、社交网络与即时通信
#   utilities     工具：系统、下载、文件管理、AI 助手及效率工具
# 规则：每个应用必须声明唯一分类，按核心功能归类；不得自创分类值。
# 参考：https://faq.altstore.io/developers/make-a-source
name: Xndeye IPA
identifier: io.xndeye.ipa
subtitle: 收集一些实用的开源 iOS 应用
iconURL: https://github.com/xndeye.png
iconBaseURL: https://xndeye.github.io/ipa/icons
